    <!-- Restore the visitor's last feed/grid choice before first paint -->
    <script>
    (function () {
        var v = 'feed';
        // Everything always opens as a single column; other pages remember the last choice.
        window.FYI_VIEW_KEY = /^\/(page\/\d+\/?)?$/.test(location.pathname) ? null : 'fyi-view';
        try { if (window.FYI_VIEW_KEY && localStorage.getItem(window.FYI_VIEW_KEY) === 'grid') v = 'grid'; } catch (e) {}
        document.documentElement.className += ' js view-' + v;
    })();
    </script>

    <!-- Cookie-free, first-party analytics. No recordings or raw IP storage. -->
    <script>
    (function () {
        if (location.hostname !== 'fyi.photos' || navigator.webdriver || navigator.doNotTrack === '1') return;
        var referrer = 'Direct';
        try {
            var source = new URL(document.referrer);
            if (source.hostname && source.hostname !== location.hostname) referrer = source.hostname.replace(/^www\./, '');
        } catch (e) {}
        var body = JSON.stringify({ path: location.pathname, referrer: referrer });
        var endpoint = 'https://admin.fyi.photos/api/analytics';
        fetch(endpoint, { method: 'POST', body: body, credentials: 'omit', keepalive: true }).catch(function () {});
    })();
    </script>

    <style>
    @font-face {
        font-family: 'StabilGrotesk-Regular';
        src: url('https://nedimyer.xyz/fonts/StabilGrotesk-Regular.woff2') format('woff2'),
             url('https://nedimyer.xyz/fonts/StabilGrotesk-Regular.woff') format('woff');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }
    @font-face {
        font-family: 'StabilGrotesk-Bold';
        src: url('https://nedimyer.xyz/fonts/StabilGrotesk-Bold.woff2') format('woff2'),
             url('https://nedimyer.xyz/fonts/StabilGrotesk-Bold.woff') format('woff');
        font-weight: bold;
        font-style: normal;
        font-display: swap;
    }

    /* ── Base ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html {
        font-size: 15px;
        line-height: 1.8;
        color: #636363;
        background: #fff;
        overflow-y: scroll;
        -webkit-text-size-adjust: 100%;
    }
    body {
        margin: 0;
        font-family: 'StabilGrotesk-Regular', sans-serif;
        line-height: 1;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }
    :root { --side: max(150px, calc(20% - 60px)); }   /* left nav width */
    html.lb-open { overflow: hidden; }
    ::selection { background: #000; color: #fff; }
    a { color: #0011ff; text-decoration: none; }
    a:hover { color: #333; }
    button { font: inherit; color: inherit; }
    [hidden] { display: none !important; }
    .bold { font-family: 'StabilGrotesk-Bold', sans-serif; font-weight: bold; }
    .visually-hidden {
        position: absolute !important; width: 1px; height: 1px; overflow: hidden;
        clip: rect(0 0 0 0); white-space: nowrap;
    }

    /* Hide Tumblr's injected controls/iframes (as in the previous theme) */
    iframe, .iframe-controls-container, .tmblr-iframe { display: none !important; }

    /* ── Sidebar ────────────────────────────────────────── */
    .site-header {
        position: fixed;
        top: 0;
        left: 0;
        width: var(--side);
        height: 100vh;
        padding: 42px 15px 24px;
        overflow-y: auto;
        z-index: 10;
        background: #fff;
    }
    .header-desc {
        margin: 0 0 40px;
        font-size: 15px;
        line-height: 30px;
        color: #bdbdbd;
    }
    .header-desc a { color: #bdbdbd; }
    .header-desc a:hover { color: #000; }

    /* Desktop: menu centered vertically in the window */
    .primary-nav {
        position: absolute;
        top: 50%;
        left: 15px;
        right: 15px;
        transform: translateY(-50%);
    }
    .primary-nav__items { list-style: none; margin: 0; padding: 0; }
    .primary-nav__item { margin: 0 0 6px; }
    .primary-nav__link {
        display: block;
        margin-top: 6px;
        color: #bdbdbd;
        font-size: 15px;
        line-height: 15px;
    }
    .primary-nav__link:hover,
    .primary-nav__link.active { color: #000; }
    /* Desktop: Info sits as far from the bottom as the name is from the top */
    .site-header__info {
        position: absolute;
        left: 15px;
        bottom: 42px;
        margin: 0;
        font-size: 15px;
        line-height: 30px;
    }
    .site-header__info .primary-nav__link { display: inline; margin: 0; line-height: inherit; }

    /* ── Main column ────────────────────────────────────── */
    .main {
        margin-left: var(--side);
        width: calc(100% - var(--side));
        min-height: 100vh;
        padding-bottom: 140px;
    }
    .container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 48px;
    }

    /* Context header: breadcrumbs */
    .page-head {
        padding-top: 42px;   /* same top offset + line-height as .header-desc so baselines align */
        font-size: 15px;
        line-height: 30px;
        color: #bdbdbd;
    }
    .page-head:empty { display: none; }
    .crumbs a { color: #bdbdbd; }
    .crumbs a:hover { color: #000; }
    .crumbs__sep { margin: 0 8px; }
    .crumbs__current { color: #000; }
    .page-head { position: relative; }

    /* Info page: same type as the breadcrumb, aligned with the name */
    /* 21px lines; top margin (30 - 21) / 2 keeps the first line on the name's baseline */
    .info__text { margin: 4.5px 0 0; max-width: 380px; line-height: 21px; text-wrap: pretty; color: #000; }
    .info__links { list-style: none; margin: 30px 0 0; padding: 0; line-height: 22px; }
    .info a { color: #bdbdbd; }
    .info a:hover { color: #000; }
    .info__email {
        position: relative;
        display: inline-block;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        line-height: inherit;
        color: #bdbdbd;
        cursor: pointer;
        transition: color .15s;
    }
    .info__email:hover,
    .info__email.is-copied { color: #000; }
    .info__email:focus { outline: none; }
    .info__email svg { width: 13px; height: 13px; margin-right: 6px; vertical-align: -1px; }
    .info__tip {
        position: absolute;
        left: 50%;
        bottom: 100%;
        transform: translate(-50%, 2px);
        padding: 5px 8px;
        border-radius: 4px;
        background: #000;
        color: #fff;
        font-size: 12px;
        line-height: 1;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transition: opacity .15s;
    }
    .info__email:hover .info__tip,
    .info__email:focus-visible .info__tip,
    .info__email.is-copied .info__tip { opacity: 1; }
    .info__photo.is-cycling { cursor: pointer; }
    .info__photo { display: block; width: min(620px, 100%); margin-top: 36px; }
    .crumbs__toggle {
        display: inline-block;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        line-height: inherit;
        cursor: pointer;
    }
    .crumbs__caret {
        width: 10px;
        height: 10px;
        margin-left: 6px;
        vertical-align: 1px;
        color: #bdbdbd;
        transition: transform .15s, color .15s;
    }
    .crumbs__toggle:hover .crumbs__caret,
    .crumbs__toggle[aria-expanded="true"] .crumbs__caret { color: #000; }
    .crumbs__toggle[aria-expanded="true"] .crumbs__caret { transform: rotate(180deg); }
    .crumbs__toggle:focus { outline: none; }


    /* ── Photo placeholder (pastel loading state) ───────── */
    .ph {
        position: relative;
        display: block;
        aspect-ratio: var(--r, 1.5);
        background-color: var(--c, #ece7e1);
        overflow: hidden;
    }
    .ph img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity .45s ease;
    }
    .ph.is-loaded img { opacity: 1; }

    /* ── Feed view ──────────────────────────────────────── */
    /* First photo sits 24px below the heading: cancel its 100px top margin */
    .posts { padding-top: 0; margin-top: -76px; }
    .post-body {
        max-width: 1200px;
        margin: 0 auto;
        color: #636363;
    }
    .post-body .npf_row,
    .post-body .npf_col {
        display: block !important;
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
    }
    .post-body figure { margin: 0 !important; width: auto !important; }
    .post-body .post_media_photo_anchor { display: block; pointer-events: none; }
    .post-body .ph {
        width: min(100%, calc(800px * var(--r, 1.5)));
        margin: 100px auto 0;
    }
    .post-body p,
    .post-body .caption {
        max-width: 640px;
        margin: 40px auto 0;
        font-size: 15px;
        line-height: 1.8;
    }
    .post-body p:empty { display: none; }

    /* ── Grid view ──────────────────────────────────────── */
    .grid {
        display: grid;
        grid-template-columns: repeat(var(--cols, 4), 1fr);
        gap: 20px;
        padding-top: 48px;
        align-items: center;
    }
    .grid--masonry { display: flex; align-items: flex-start; }
    .grid__col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
    .tile {
        display: block;
        width: 100%;
        padding: 0;
        border: 0;
        background: none;
        cursor: zoom-in;
    }
    .tile .ph img { transition: opacity .45s ease; }
    .tile:hover .ph.is-loaded img { opacity: .82; }
    .tile:focus, .tile:focus-visible { outline: none; }

    html.view-feed .grid,
    html.view-grid .posts { display: none; }

    /* ── Landing pages (Travel / Series) ────────────────── */
    .landing {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 40px 20px;
        padding-top: 48px;
    }
    .landing--series { grid-template-columns: repeat(2, 1fr); gap: 48px 24px; }
    .place { display: block; color: #000; }
    .place:hover .ph.is-loaded img { opacity: .82; }
    .place__label {
        display: block;
        margin-top: 12px;
        font-size: 15px;
        line-height: 1.4;
        color: #000;
    }
    .place:hover .place__label { text-decoration: underline; }
    body.is-shuffling #posts,
    body.is-shuffling #grid { display: none; }

    /* Pastel placeholder blocks while posts are being fetched */
    .skeleton__feed { padding-top: 24px; }
    .skeleton__feed .ph { width: min(100%, 1200px); margin: 100px auto 0; }
    .skeleton__feed .ph:first-child { margin-top: 0; }
    .skeleton--more .skeleton__feed { padding-top: 100px; }
    .skeleton--more .skeleton__grid { padding-top: 20px; }
    html.view-grid .skeleton__feed { display: none; }
    body.is-info .posts,
    body.is-info .loader { display: none !important; }
    body.is-landing .posts,
    body.is-landing .grid,
    body.is-landing .loader { display: none !important; }

    /* ── Infinite scroll status ─────────────────────────── */
    .loader {
        padding: 60px 0 0;
        text-align: center;
        font-size: 14px;
        line-height: 1.8;
        color: #bdbdbd;
    }
    .loader a, .loader button {
        color: #bdbdbd;
        background: none;
        border: 0;
        cursor: pointer;
        padding: 0;
    }
    .loader a:hover, .loader button:hover { color: #000; }
    html.js .loader .js-next-page { display: none; }

    /* ── Bottom-right controls (people + feed/grid) ─────── */
    .dock {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .view-toggle {
        display: flex;
        gap: 2px;
        padding: 4px;
        background: rgba(255, 255, 255, .92);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        border: 1px solid #e5e5e5;
        border-radius: 999px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, .05);
    }
    .view-toggle__btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: #bdbdbd;
        cursor: pointer;
        transition: background .15s, color .15s;
    }
    .view-toggle__btn:hover { color: #333; }
    .view-toggle__btn[aria-pressed="true"] { color: #000; background: #f2f2f2; }
    .view-toggle__btn svg { width: 16px; height: 16px; display: block; }
    .view-toggle__btn:focus-visible { outline: 2px solid #000; outline-offset: 1px; }

    /* ── People picker ──────────────────────────────────── */
    .view-toggle__btn[aria-expanded="true"],
    .view-toggle__btn.is-filtered { color: #000; background: #f2f2f2; }
    .people-panel {
        position: fixed;
        right: 24px;
        bottom: 80px;
        z-index: 51;
        width: min(760px, calc(100vw - 48px));
        max-height: calc(100vh - 120px);
        overflow-y: auto;
        padding: 22px 26px 24px;
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 14px;
        box-shadow: 0 6px 28px rgba(0, 0, 0, .07);
        font-size: 15px;
        line-height: 1.65;
    }
    .people-panel--dropdown {
        position: absolute;
        top: 100%;
        left: 0;
        right: auto;
        bottom: auto;
        margin-top: 12px;
        z-index: 52;
        max-height: calc(100vh - 150px);
    }
    .people-panel--travel { width: min(480px, calc(100vw - 48px)); }
    .people-panel--travel .people-panel__list { columns: 3 120px; }
    .people-panel__all { display: inline-block; margin-bottom: 12px; color: #bdbdbd; }
    .people-panel__list {
        list-style: none;
        margin: 0;
        padding: 0;
        columns: 4 140px;
        column-gap: 24px;
    }
    .people-panel__group { break-inside: avoid; padding-bottom: 10px; }
    .people-panel__group ul { list-style: none; margin: 0; padding: 0; }
    .people-panel__letter {
        display: block;
        font-size: 11px;
        line-height: 1.8;
        letter-spacing: .06em;
        color: #d9d9d9;
    }
    .people-panel a { color: #bdbdbd; }
    .people-panel a:hover,
    .people-panel a.active { color: #000; }

    /* ── Lightbox ───────────────────────────────────────── */
    .lightbox {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        touch-action: pan-y;
    }
    .lb-stage { display: flex; flex-direction: column; align-items: stretch; gap: 14px; }
    .lightbox .ph {
        width: min(calc(100vw - 140px), calc((100vh - 150px) * var(--r, 1.5)));
        user-select: none;
        -webkit-user-select: none;
    }
    .lightbox .ph img { object-fit: contain; }
    /* Subtle tag pills under the photo */
    /* width:0 + min-width:100% → exactly as wide as the photo, so tags line up with its left edge */
    .lb-tags { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 6px; min-height: 24px; width: 0; min-width: 100%; }
    .lb-tag {
        display: inline-block;
        padding: 5px 10px 4px;
        border-radius: 6px;
        background: #f6f6f6;
        color: #a8a8a8;
        font-size: 12px;
        line-height: 15px;
        transition: background .15s, color .15s;
    }
    .lb-tag:hover { background: #eee; color: #000; }
    .lb-btn {
        position: fixed;
        z-index: 1001;
        padding: 20px;
        border: 0;
        background: transparent;
        color: #bbb;
        line-height: 0;
        cursor: pointer;
        transition: color .15s;
    }
    .lb-btn svg { width: 28px; height: 28px; display: block; }
    .lb-btn:hover { color: #000; }
    .lb-btn:focus, .lb-btn:focus-visible { outline: none; }
    .lb-prev { left: 0; top: 50%; transform: translateY(-50%); }
    .lb-next { right: 0; top: 50%; transform: translateY(-50%); }
    .lb-close { top: 4px; right: 4px; }
    .lb-close svg { width: 22px; height: 22px; }

    /* ── Responsive ─────────────────────────────────────── */
    @media (max-width: 961px) {
        .site-header {
            position: relative;
            width: 100%;
            height: auto;
            padding: 10px 10px 0;   /* left edge matches the photos and page titles */
        }
        .header-desc { margin-bottom: 0; }
        /* Phones: menu on one line — "Everything, People, Travel, Series, Info" */
        .site-header { display: flex; flex-wrap: wrap; align-items: baseline; }
        .header-desc { flex: 0 0 100%; }
        .primary-nav { position: static; transform: none; margin-top: 2px; }
        .primary-nav__items, .primary-nav__item { display: inline; margin: 0; }
        .primary-nav .primary-nav__link { display: inline; margin: 0; line-height: 24px; }
        .primary-nav__item::after { content: ', '; color: #bdbdbd; }
        .site-header__info { position: static; margin: 2px 0 0 .25em; line-height: 24px; }
        .main { margin-left: 0; width: 100%; }
        .container { padding: 0 10px; }
        .page-head { padding-top: 24px; }
        .posts { padding-top: 0; margin-top: 0; }
        .post-body .ph { margin-top: 50px; }
        .grid { padding-top: 24px; }
        .landing { grid-template-columns: repeat(2, 1fr); gap: 28px 12px; padding-top: 24px; }
    }
    @media (max-width: 700px) {
        .landing--series { grid-template-columns: 1fr; }
    }
    @media (max-width: 900px) {
        .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .grid__col { gap: 12px; }
    }
    @media (max-width: 961px) {
        .skeleton__feed { padding-top: 0; }
        .skeleton__feed .ph { margin-top: 50px; }
        .skeleton--more .skeleton__feed { padding-top: 50px; }
        .skeleton--more .skeleton__grid { padding-top: 12px; }
    }
    @media (max-width: 700px) {
        /* Phones: slightly larger name, menu and info text */
        .header-desc { font-size: 17px; }
        .page-head { font-size: 17px; }
        /* Phones: just the name/place, without "People /" or "Travel /" */
        .crumbs__parent, .crumbs__sep { display: none; }
        .primary-nav__link { font-size: 17px; }
        .primary-nav__item::after { font-size: 17px; }
        .site-header__info { font-size: 17px; }
        .info__text { margin-top: 0; font-size: 17px; line-height: 24px; }
        .info__links { font-size: 17px; line-height: 27px; }
        .info__email svg { width: 14px; height: 14px; }

        .dock { right: auto; left: 50%; bottom: 16px; transform: translateX(-50%); }
        .people-panel { right: 16px; bottom: 72px; width: calc(100vw - 32px); }
        .people-panel__list { columns: 2; }
        .people-panel--dropdown { left: 0; right: 0; bottom: auto; width: auto; }
        .lb-prev, .lb-next { display: none; }
        .lightbox .ph { width: min(96vw, calc((100vh - 70px) * var(--r, 1.5))); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    }

    /* Guard against Tumblr's injected NPF styles (flex figures, image sizing). */
    .post-body figure.tmblr-full,
    .post-body .post_media_photo_anchor { display: block !important; width: auto !important; max-width: none !important; }
    .ph img { width: 100% !important; height: 100% !important; max-width: none !important; max-height: none !important; margin: 0 !important; }

    .tmblr-alt-text-helper { display: none !important; }

    /* Guard against leftover Custom CSS from the old theme saved in Tumblr. */
    .site-header { border: 0 !important; float: none !important; }
    .main { float: none !important; }
    .primary-nav__link { float: none !important; width: auto !important; margin-left: 0 !important; margin-right: 0 !important; }
    </style>
</head>

<body class="{block:IndexPage}index-page{/block:IndexPage} {block:PermalinkPage}permalink-page{/block:PermalinkPage} {block:TagPage}tag-page{/block:TagPage} {block:SearchPage}search-page{/block:SearchPage} {block:DayPage}day-page{/block:DayPage}" data-tag="{block:TagPage}{Tag}{/block:TagPage}">

    <header role="banner" class="site-header">
        <p class="header-desc"><a href="/">Andrew Nedimyer</a></p>

            var s = String(t || '');
            try { s = decodeURIComponent(s.replace(/\+/g, ' ')); } catch (e) {}
            return s.toLowerCase().trim().replace(/[\s_]+/g, '-');
        }
        function find(list, tag) {
            for (var i = 0; i < list.length; i++) if (norm(list[i].tag) === tag) return list[i];
            return null;
        }
        function pastel(key) {
            var h = 0;
            for (var i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) | 0;
            return PALETTE[Math.abs(h) % PALETTE.length];
        }
        function el(tag, cls, text) {
            var n = document.createElement(tag);
            if (cls) n.className = cls;
            if (text != null) n.textContent = text;
            return n;
        }
        function tagUrl(tag) { return '/tagged/' + encodeURIComponent(tag); }
        // Drop Tumblr's cropped sizes (e.g. s75x75_c1) so only full-frame renditions are used.
        function cleanSrcset(srcset) {
            if (!srcset) return '';
            return srcset.split(',').map(function (s) { return s.trim(); })
                .filter(function (s) { return s && !/_c1\//.test(s); })
                .join(', ');
        }

                    toggleBtn.appendChild(el('span', 'crumbs__current', label));
                    toggleBtn.insertAdjacentHTML('beforeend', '<svg class="crumbs__caret" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 3.5L5 7l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>');
                    crumbs.appendChild(toggleBtn);
                } else {
                    crumbs.appendChild(el('span', 'crumbs__current', label));
                }
                pageHead.appendChild(crumbs);
                if (toggleBtn) {
                    var dropdown = el('nav', 'people-panel people-panel--dropdown people-panel--' + section);
                    dropdown.id = 'crumb-dropdown';
                    dropdown.setAttribute('aria-label', ALL_LABEL[section]);
                    dropdown.hidden = true;
                    pageHead.appendChild(dropdown);
                    wireDropdown(toggleBtn, dropdown, section);
                }
                return;
            }
            if (section === 'everything' && !/\/page\/\d+/.test(path)) {
                // "Latest post: June 12, 2026" from the newest post's timestamp.
                var first = feed.querySelector('.js-post[data-ts]');
                var ts = first && parseInt(first.getAttribute('data-ts'), 10);
                if (ts) {
                    var latest = el('div', 'crumbs');
                    latest.appendChild(el('span', null, 'Latest post:'));
                    latest.appendChild(document.createTextNode(' '));
                    latest.appendChild(el('span', 'crumbs__current', new Date(ts * 1000).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })));
                    pageHead.appendChild(latest);
                }
                return;
            }
            if (section === 'info') {
                renderInfo();
                return;
            }
            if (tag && !isLanding) {
                pageHead.appendChild(el('div', 'crumbs crumbs__current', '#' + rawTagLabel));
            }
        }

        /* ── Info page ────────────────────────────────────── */
        function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
            var ta = el('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;opacity:0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } finally { ta.remove(); }
            return Promise.resolve();
        }

        function renderInfo() {
            body.classList.add('is-info');
            var box = el('div', 'info');
            box.appendChild(el('p', 'info__text', INFO.text));

            var ul = el('ul', 'info__links');
            // Icon + address are one control: hover shows "Copy", click copies the email.
            var li = el('li');
            var mail = el('button', 'info__email');
            mail.type = 'button';
            mail.setAttribute('aria-label', 'Copy email address ' + INFO.email);
            mail.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M10.5 3.5v-.5a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>';
            mail.appendChild(document.createTextNode(INFO.email));
            var tip = el('span', 'info__tip', 'Copy');
            tip.setAttribute('aria-hidden', 'true');
            mail.appendChild(tip);
            var status = el('span', 'visually-hidden');
            status.setAttribute('aria-live', 'polite');
            var t;
            mail.addEventListener('click', function () {
                copyText(INFO.email).then(function () {
                    tip.textContent = 'Copied';
                    status.textContent = 'Email address copied';
                    mail.classList.add('is-copied');
                    clearTimeout(t);
                    t = setTimeout(function () {
                        mail.classList.remove('is-copied');
                        tip.textContent = 'Copy';
                        status.textContent = '';
                    }, 1600);
                });
            });
            mail.addEventListener('mouseleave', function () {
                if (!mail.classList.contains('is-copied')) tip.textContent = 'Copy';
            });
            li.appendChild(mail);
            li.appendChild(status);
            ul.appendChild(li);

            li = el('li');
            var ig = el('a', null, '@' + INFO.instagram);
            ig.href = 'https://www.instagram.com/' + INFO.instagram + '/';
            ig.target = '_blank';
            ig.rel = 'noopener';
            li.appendChild(ig);
            ul.appendChild(li);

            li = el('li');
            var site = el('a', null, INFO.website);
            site.href = 'https://' + INFO.website + '/';
            site.target = '_blank';
            site.rel = 'noopener';
            li.appendChild(site);
            ul.appendChild(li);
            box.appendChild(ul);

            if (INFO.photo) {
                var ph = makePh(1.5, pastel(INFO.photo), INFO.photo, '', '', 'Andrew Nedimyer');
                ph.classList.add('info__photo');
                box.appendChild(ph);
                lazy(ph.firstChild);
                if (INFO.selfTag) cycleSelfPhotos(ph);
            }
            pageHead.appendChild(box);
        }

        // Media id shared by every size of a Tumblr image: 64.media.tumblr.com/<id>/…
        function mediaKey(url) {
            try { return new URL(url, location.href).pathname.split('/')[1] || url; } catch (e) { return url; }
        }

        // Collect every photo tagged INFO.selfTag (all pages of /tagged/<selfTag>).
        function loadSelfPhotos() {
            var found = [], seenKeys = {};
            function take(doc) {
                Array.prototype.slice.call(doc.querySelectorAll('.js-post template.js-body')).forEach(function (tpl) {
                    var imgs = Array.prototype.slice.call(tpl.content.querySelectorAll('img'));
                    var parsed = imgs.map(function (i) { return parseAlt(i.getAttribute('alt')); });
                    var tagged = parsed.some(function (pa) { return pa.tags; });
                    imgs.forEach(function (img, n) {
                        if (tagged && (parsed[n].tags || []).indexOf(INFO.selfTag) === -1) return;
                        var a = img.closest('.post_media_photo_anchor');
                        var full = (a && a.getAttribute('data-big-photo')) || img.getAttribute('src');
                        if (!full || seenKeys[mediaKey(full)]) return;
                        seenKeys[mediaKey(full)] = true;
                        var w = parseFloat((a && a.getAttribute('data-big-photo-width')) || img.getAttribute('data-orig-width')) || 0;
                        var h = parseFloat((a && a.getAttribute('data-big-photo-height')) || img.getAttribute('data-orig-height')) || 0;
                        found.push({ full: full, srcset: cleanSrcset(img.getAttribute('srcset')), ratio: w && h ? w / h : 1.5 });
                    });
                });
                return doc.querySelector('.js-next-page');
            }
            function page(n) {
                var url = tagUrl(INFO.selfTag) + (n > 1 ? '/page/' + n : '');
                return fetch(url, { credentials: 'same-origin' })
                    .then(function (r) { return r.ok ? r.text() : ''; })
                    .then(function (html) {
                        var more = html && take(new DOMParser().parseFromString(html, 'text/html'));
                        return more && n < 50 ? page(n + 1) : found;
                    })
                    .catch(function () { return found; });
            }
            return page(1);
        }

        function cycleSelfPhotos(ph) {
            var list = [{ full: INFO.photo, srcset: '', ratio: 0 }];
            var i = 0;
            loadSelfPhotos().then(function (photos) {
                photos.forEach(function (p) {
                    if (mediaKey(p.full) === mediaKey(INFO.photo)) list[0] = p;
                    else if (p.ratio >= 1) list.push(p);   // landscape/square only
                });
                if (list.length > 1) {
                    ph.classList.add('is-cycling');
                    ph.title = 'Click for another';
                    preload(1);
                }
            });
            function preload(n) {
                var p = list[n % list.length];
                if (!p || p.pre) return;
                p.pre = new Image();
                if (p.srcset) { p.pre.sizes = '620px'; p.pre.srcset = p.srcset; }
                p.pre.src = p.full;
            }
            ph.addEventListener('click', function () {
                if (list.length < 2) return;
                i = (i + 1) % list.length;
                var p = list[i];
                var img = ph.firstChild;
                if (p.ratio) ph.style.setProperty('--r', p.ratio);
                ph.style.setProperty('--c', pastel(p.full));
                ph.classList.remove('is-loaded');
                img.onload = img.onerror = function () { fitRatio(ph, img); ph.classList.add('is-loaded'); };
                img.removeAttribute('srcset');
                if (p.srcset) { img.sizes = '620px'; img.srcset = p.srcset; }
                img.src = p.full;
                preload(i + 1);
            });
        }

        /* ── People picker (breadcrumb dropdown + bottom-right button) ── */
        var ALL_LABEL = { people: 'Everyone', travel: 'Everywhere', series: 'All series' };

        // Alphabetical list for a category. People get A–Z letter headings.
        function fillList(panel, cat) {
            var all = el('a', 'people-panel__all', ALL_LABEL[cat]);
            all.href = tagUrl(cat);
            if (tag === cat) { all.classList.add('active'); all.setAttribute('aria-current', 'page'); }
            panel.appendChild(all);

            var ul = el('ul', 'people-panel__list');
            var lastLetter = '', group = ul;
            CONFIG[cat].slice().sort(function (a, b) {
                return a.label.localeCompare(b.label, undefined, { sensitivity: 'base' });
            }).forEach(function (p) {
                var letter = p.label.charAt(0).toUpperCase();
                if (cat === 'people' && letter !== lastLetter) {
                    // One group per letter so a heading never splits from its names.
                    var g = el('li', 'people-panel__group');
                    g.appendChild(el('span', 'people-panel__letter', letter));
                    group = el('ul');
                    g.appendChild(group);
                    ul.appendChild(g);
                    lastLetter = letter;
                }
                var li = el('li');
                var a = el('a', null, p.label);
                a.href = tagUrl(p.tag);
                if (norm(p.tag) === tag) { a.classList.add('active'); a.setAttribute('aria-current', 'page'); }
                li.appendChild(a);
                group.appendChild(li);
            });
            panel.appendChild(ul);
        }

        var dropdowns = [];
        function wireDropdown(trigger, panel, cat) {
            fillList(panel, cat);
            var dd = {
                setOpen: function (open) {
                    panel.hidden = !open;
                    trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
                    if (open) {
                        var active = panel.querySelector('.people-panel__list a.active');
                        if (active) active.scrollIntoView({ block: 'nearest' });
                    }
                }
            };
            trigger.addEventListener('click', function () {
                var open = panel.hidden;
                dropdowns.forEach(function (d) { if (d !== dd) d.setOpen(false); });
                dd.setOpen(open);
            });
            document.addEventListener('click', function (e) {
                if (!panel.hidden && !panel.contains(e.target) && !trigger.contains(e.target)) dd.setOpen(false);
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && !panel.hidden) { dd.setOpen(false); trigger.focus(); }
            });
            dropdowns.push(dd);
        }

        // Bottom-right person button (People pages only).
        function renderPeoplePicker() {
            var btn = document.getElementById('people-btn');
            if (tag !== 'people') btn.classList.add('is-filtered');
            wireDropdown(btn, document.getElementById('people-panel'), 'people');
            document.getElementById('people-toggle').hidden = false;
        }

        /* ── Lazy loading ─────────────────────────────────── */
        // If a photo had no size data, correct the placeholder to its real shape.
        function fitRatio(ph, img) {
            if (!img.naturalWidth || !img.naturalHeight) return;
            var real = img.naturalWidth / img.naturalHeight;
            var cur = parseFloat(ph.style.getPropertyValue('--r')) || 0;
            if (Math.abs(real - cur) / real > 0.02) ph.style.setProperty('--r', real);
        }
        function loadImg(img) {
            var ph = img.parentNode;
            var done = function () { fitRatio(ph, img); ph.classList.add('is-loaded'); };
            img.onload = done;
            img.onerror = done;
            if (img.getAttribute('data-srcset')) {
                img.srcset = img.getAttribute('data-srcset');
                img.removeAttribute('data-srcset');
            }
            img.src = img.getAttribute('data-src');
            img.removeAttribute('data-src');
        }
        var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (!entry.isIntersecting) return;
                io.unobserve(entry.target);
                loadImg(entry.target);
            });
        }, { rootMargin: '800px 0px' }) : null;
        function lazy(img) { if (io) io.observe(img); else loadImg(img); }

        function makePh(ratio, color, src, srcset, sizes, alt) {
            var ph = el('span', 'ph');
            ph.style.setProperty('--r', ratio);
            ph.style.setProperty('--c', color);
            var img = el('img');
            img.alt = alt || '';
            img.decoding = 'async';
            if (src) img.setAttribute('data-src', src);
            if (srcset) { img.setAttribute('data-srcset', srcset); img.sizes = sizes; }
            ph.appendChild(img);
            return ph;
        }

        /* ── Posts → feed + grid ──────────────────────────── */
        /* Per-photo tags live at the end of each image's alt text: "… [bucky, japan]".
           On People/Travel/Series pages, photos in a tagged post that don't match are hidden.
           Posts with no per-photo tags show all their photos. */
        var ALT_TAGS = /\s*\[([^\[\]]*)\]\s*$/;
        var filterTag = (section && section !== 'everything' && !isPermalink) ? tag : '';

        function parseAlt(alt) {
            var s = String(alt || '').trim();
            if (s.toLowerCase() === 'image') s = '';
            var m = s.match(ALT_TAGS);
            if (!m) return { desc: s, tags: null };
            return { desc: s.slice(0, m.index).trim(), tags: m[1].split(',').map(norm).filter(Boolean) };
        }
        function categoryOf(t) {
            if (t === 'people' || t === 'travel' || t === 'series') return t;
            if (find(CONFIG.people, t)) return 'people';
            if (find(CONFIG.travel, t)) return 'travel';
            if (find(CONFIG.series, t)) return 'series';
            return '';
        }
        function photoMatches(tags) {
            if (!filterTag) return true;
            return tags.some(function (t) { return t === filterTag || categoryOf(t) === filterTag; });
        }

        // The main People page shows every portrait in random order (fresh on each visit).
        var shuffleMode = tag === 'people' && !isPermalink;

        function hydratePost(article) {
            var tpl = article.querySelector('template.js-body');
            if (!tpl) return;
            var frag = tpl.content.cloneNode(true);
            var feedImgs = [];
            // Tumblr adds an "ALT" badge after every image with alt text; never show it.
            Array.prototype.slice.call(frag.querySelectorAll('.tmblr-alt-text-helper')).forEach(function (n) { n.remove(); });
            var imgs = Array.prototype.slice.call(frag.querySelectorAll('img'));
            var parsed = imgs.map(function (img) { return parseAlt(img.getAttribute('alt')); });
            var postHasPhotoTags = parsed.some(function (p) { return p.tags; });
            var shown = 0;

            imgs.forEach(function (img, n) {
                var a    = img.closest('.post_media_photo_anchor');
                var src  = img.getAttribute('src') || '';
                var full = (a && a.getAttribute('data-big-photo')) || src;
                if (!full) return;
                if (postHasPhotoTags && !photoMatches(parsed[n].tags || [])) {
                    var box = img.closest('figure') || a || img;
                    box.parentNode.removeChild(box);
                    return;
                }
                shown++;
                var w = parseFloat((a && a.getAttribute('data-big-photo-width')) || img.getAttribute('data-orig-width') || img.getAttribute('width')) || 0;
                var h = parseFloat((a && a.getAttribute('data-big-photo-height')) || img.getAttribute('data-orig-height') || img.getAttribute('height')) || 0;
                var ratio  = (w && h) ? w / h : 1.5;
                var srcset = cleanSrcset(img.getAttribute('srcset'));
                var color  = pastel(full);
                var alt    = parsed[n].desc;

                var sizes = '(max-width: 961px) 100vw, ' + Math.round(Math.min(1200, 800 * ratio)) + 'px';
                var ph = makePh(ratio, color, src || full, srcset, sizes, alt);
                img.parentNode.replaceChild(ph, img);
                feedImgs.push(ph.firstChild);

                images.push({ full: full, srcset: srcset, ratio: ratio, color: color, alt: alt, feedPh: ph, tags: parsed[n].tags || [] });
                if (!shuffleMode) addTile(images.length - 1);
            });

            if (imgs.length && !shown) {
                article.hidden = true;
                return;
            }
            Array.prototype.slice.call(frag.querySelectorAll('.npf_col, .npf_row')).reverse().forEach(function (n) {
                if (!n.querySelector('img, .ph') && !n.textContent.trim()) n.parentNode.removeChild(n);
            });
            tpl.parentNode.replaceChild(frag, tpl);
            if (!shuffleMode) feedImgs.forEach(lazy);
        }

        /* ── Shuffle: load every page, then randomize all photos ─ */
        function fetchPage(url) {
            return fetch(url, { credentials: 'same-origin' })
                .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
                .then(function (html) {
                    var doc = new DOMParser().parseFromString(html, 'text/html');
                    var added = 0;
                    Array.prototype.slice.call(doc.querySelectorAll('.js-post')).forEach(function (a) {
                        if (!a.id || seen[a.id]) return;
                        seen[a.id] = true;
                        hydratePost(document.importNode(a, true));
                        added++;
                    });
                    return { added: added, hasNext: !!doc.querySelector('.js-next-page') };
                })
                .catch(function () { return { added: 0, hasNext: false }; });
        }

        function loadAllThenShuffle() {
            body.classList.add('is-shuffling');
            var sk = makeSkeleton(2, 3, false);
            var base = location.pathname.replace(/\/page\/\d+\/?$/, '').replace(/\/$/, '');
            var BATCH = 4, MAX_PAGE = 200;
            function batch(start) {
                if (!nextUrl || start > MAX_PAGE) return Promise.resolve();
                var jobs = [];
                for (var n = start; n < start + BATCH; n++) jobs.push(fetchPage(base + '/page/' + n));
                return Promise.all(jobs).then(function (results) {
                    var last = results[results.length - 1];
                    var done = results.some(function (r) { return !r.added || !r.hasNext; });
                    return done || !last.hasNext ? null : batch(start + BATCH);
                });
            }
            return batch(2).then(function () {
                nextUrl = null;
                for (var i = images.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var t = images[i]; images[i] = images[j]; images[j] = t;
                }
                feed.textContent = '';
                images.forEach(function (it, i) {
                    var art = el('article', 'post');
                    var bodyEl = el('div', 'post-body');
                    bodyEl.appendChild(it.feedPh);
                    art.appendChild(bodyEl);
                    feed.appendChild(art);
                    lazy(it.feedPh.firstChild);
                    addTile(i);
                });
                sk.remove();
                body.classList.remove('is-shuffling');
            });
        }

        function addTile(i) {
            var it = images[i];
            var btn = el('button', 'tile');
            btn.type = 'button';
            btn.setAttribute('aria-label', 'Open photo ' + (i + 1));
            btn.setAttribute('data-index', i);
            var ph = makePh(it.ratio, it.color, it.full, it.srcset, tileSizes, it.alt);
            btn.appendChild(ph);
            if (masonry) {
                btn.setAttribute('data-r', it.ratio);
                if (!masonryCols.length) buildMasonry();
                placeTile(btn);
            } else {
                grid.appendChild(btn);
            }
            lazy(ph.firstChild);
        }

        /* Masonry: each photo goes into the currently shortest column (photo order
           still reads roughly left→right, top→bottom). Phones use 2 columns. */
        var masonryCols = [], masonryHeights = [];
        var phoneGrid = window.matchMedia('(max-width: 900px)');
        function buildMasonry() {
            var tiles = Array.prototype.slice.call(grid.querySelectorAll('.tile')).sort(function (a, b) {
                return a.getAttribute('data-index') - b.getAttribute('data-index');
            });
            grid.textContent = '';
            masonryCols = []; masonryHeights = [];
            var n = phoneGrid.matches ? 2 : gridCols;
            for (var c = 0; c < n; c++) {
                var col = el('div', 'grid__col');
                grid.appendChild(col);
                masonryCols.push(col);
                masonryHeights.push(0);
            }
            tiles.forEach(placeTile);
        }
        function placeTile(btn) {
            var i = masonryHeights.indexOf(Math.min.apply(null, masonryHeights));
            masonryCols[i].appendChild(btn);
            masonryHeights[i] += 1 / (parseFloat(btn.getAttribute('data-r')) || 1.5) + 0.06;
        }
        if (masonry) {
            var onBreakpoint = function () { if (masonryCols.length) buildMasonry(); };
            if (phoneGrid.addEventListener) phoneGrid.addEventListener('change', onBreakpoint);
            else phoneGrid.addListener(onBreakpoint);
        }

        grid.addEventListener('click', function (e) {
            var t = e.target.closest('.tile');
            if (t) openLightbox(+t.getAttribute('data-index'));
        });

        /* ── Placeholder blocks while posts load ──────────── */
        var skeletonGrids = [];
        function fillSkeletonGrid(g, gridRows, off) {
            g.textContent = '';
            var count = phoneGrid.matches ? 2 : gridCols;
            var gap = phoneGrid.matches ? 12 : 20;
            var container = g.parentNode.parentNode;
            var style = getComputedStyle(container);
            var width = container.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
            var columnWidth = Math.max(1, (width - gap * (count - 1)) / count);
            var targetHeight = Math.max(window.innerHeight, window.innerHeight - g.getBoundingClientRect().top);
            var ratios = [1.5, 0.67, 1.5, 1, 0.67, 1.5];
            var cols = [], heights = [];
            if (masonry) {
                for (var c = 0; c < count; c++) {
                    var col = el('div', 'grid__col');
                    g.appendChild(col);
                    cols.push(col);
                    heights.push(0);
                }
            }
            var minimum = gridRows * count;
            var total = masonry ? minimum : Math.max(minimum, Math.ceil(targetHeight / (columnWidth / 1.5 + gap)) * count);
            for (var i = 0; i < total || (masonry && Math.min.apply(null, heights) - gap < targetHeight); i++) {
                var ratio = masonry ? (images.length ? images[i % images.length].ratio : ratios[i % ratios.length]) : 1.5;
                var ph = el('span', 'ph');
                ph.style.setProperty('--r', ratio);
                ph.style.setProperty('--c', PALETTE[(off + i * 3) % PALETTE.length]);
                if (masonry) {
                    var shortest = heights.indexOf(Math.min.apply(null, heights));
                    cols[shortest].appendChild(ph);
                    heights[shortest] += columnWidth / ratio + gap;
                } else {
                    g.appendChild(ph);
                }
            }
        }
        window.addEventListener('resize', function () {
            skeletonGrids = skeletonGrids.filter(function (item) { return item.grid.isConnected; });
            skeletonGrids.forEach(function (item) { fillSkeletonGrid(item.grid, item.rows, item.off); });
        });
        function makeSkeleton(feedBlocks, gridRows, more) {
            var sk = el('div', 'skeleton' + (more ? ' skeleton--more' : ''));
            sk.setAttribute('aria-hidden', 'true');
            var f = el('div', 'skeleton__feed');
            var g = el('div', 'grid skeleton__grid');
            if (masonry) g.classList.add('grid--masonry');
            g.style.setProperty('--cols', gridCols);
            var off = Math.floor(Math.random() * PALETTE.length);
            function block(i) {
                var ph = el('span', 'ph');
                ph.style.setProperty('--r', 1.5);
                ph.style.setProperty('--c', PALETTE[(off + i * 3) % PALETTE.length]);
                return ph;
            }
            for (var i = 0; i < feedBlocks; i++) f.appendChild(block(i));
            sk.appendChild(f);
            sk.appendChild(g);
            loader.parentNode.insertBefore(sk, loader);
            fillSkeletonGrid(g, gridRows, off);
            skeletonGrids = skeletonGrids.filter(function (item) { return item.grid.isConnected; });
            skeletonGrids.push({ grid: g, rows: gridRows, off: off });
            return sk;
        }

        /* ── Infinite scroll (follows the current tag/page) ─ */
        var nextLink = loader.querySelector('.js-next-page');
        var nextUrl  = nextLink ? nextLink.href : null;
        var pending  = null;

        // No status text, ever: placeholder blocks show while loading, and failed
        // fetches keep their blocks on screen and retry quietly with backoff.
        var retrySk = null, retryDelay = 2000;

        function loadMore() {
            if (pending) return pending;
            if (!nextUrl) return Promise.resolve(false);
            var sk = retrySk || makeSkeleton(1, 1, true);
            retrySk = null;
            var url = nextUrl;
            pending = fetch(url, { credentials: 'same-origin' })
                .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
                .then(function (html) {
                    var doc = new DOMParser().parseFromString(html, 'text/html');
                    var added = 0;
                    Array.prototype.slice.call(doc.querySelectorAll('.js-post')).forEach(function (a) {
                        if (!a.id || seen[a.id]) return;
                        seen[a.id] = true;
                        var node = document.importNode(a, true);
                        feed.appendChild(node);
                        hydratePost(node);
                        added++;
                    });
                    var nl = doc.querySelector('.js-next-page');
                    nextUrl = nl ? new URL(nl.getAttribute('href'), url).href : null;
                    sk.remove();
                    pending = null;
                    retryDelay = 2000;
                    updateLightboxNav();
                    requestAnimationFrame(maybeLoadMore);
                    return added > 0;
                })
                .catch(function () {
                    retrySk = sk;
                    pending = null;
                    setTimeout(loadMore, retryDelay);
                    retryDelay = Math.min(retryDelay * 2, 30000);
                    return false;
                });
            return pending;
        }

        function maybeLoadMore() {
            if (!isStream || !nextUrl || pending) return;
            if (loader.getBoundingClientRect().top < window.innerHeight + 1500) loadMore();
        }

        /* ── Feed / grid toggle ───────────────────────────── */
        var toggleBtns = toggle.querySelectorAll('.view-toggle__btn');
        function currentView() { return root.classList.contains('view-grid') ? 'grid' : 'feed'; }
        function syncToggle() {
            var v = currentView();
            for (var i = 0; i < toggleBtns.length; i++) {
                toggleBtns[i].setAttribute('aria-pressed', toggleBtns[i].getAttribute('data-view') === v ? 'true' : 'false');
            }
        }
        function setView(v) {
            if (v === currentView()) return;
            root.classList.remove('view-feed', 'view-grid');
            root.classList.add('view-' + v);
            try { if (window.FYI_VIEW_KEY) localStorage.setItem(window.FYI_VIEW_KEY, v); } catch (e) {}
            syncToggle();
            window.scrollTo(0, 0);
            requestAnimationFrame(maybeLoadMore);
        }
        toggle.addEventListener('click', function (e) {
            var b = e.target.closest('.view-toggle__btn');
            if (b) setView(b.getAttribute('data-view'));
        });

        /* ── Lightbox ─────────────────────────────────────── */
        var cur = -1;
        var touchX = null, touchY = null;

        function preload(i) {
            var it = images[i];
            if (!it) return;
            var p = new Image();
            if (it.srcset) { p.sizes = lbSizes(it.ratio); p.srcset = it.srcset; }
            p.src = it.full;
        }
        // People first, then places, then series; only tags with a name in CONFIG.
        function renderLbTags(tags) {
            var box = lb.querySelector('.lb-tags');
            box.textContent = '';
            ['people', 'travel', 'series'].forEach(function (cat) {
                (tags || []).map(function (t) { return find(CONFIG[cat], t); }).filter(Boolean)
                    .sort(function (a, b) { return a.label.localeCompare(b.label, undefined, { sensitivity: 'base' }); })
                    .forEach(function (e) {
                        var a = el('a', 'lb-tag', e.label);
                        a.href = tagUrl(e.tag);
                        box.appendChild(a);
                    });
            });
        }
        function lbSizes(ratio) {
            var w = Math.min(window.innerWidth - 140, (window.innerHeight - 150) * ratio);
            if (window.innerWidth <= 700) w = Math.min(window.innerWidth * 0.96, (window.innerHeight - 70) * ratio);
            return Math.max(1, Math.round(w)) + 'px';
        }
        function updateLightboxNav() {
            if (lb.hidden) return;
            lbPrev.hidden = cur <= 0;
            lbNext.hidden = cur >= images.length - 1 && !nextUrl;
        }
        function show(i) {
            var it = images[i];
            if (!it) return;
            cur = i;
            lbPh.style.setProperty('--r', it.ratio);
            lbPh.style.setProperty('--c', it.color);
            lbPh.classList.remove('is-loaded');
            while (lbPh.firstChild) lbPh.removeChild(lbPh.firstChild);
            var img = el('img');
            img.alt = it.alt || '';
            img.onload = img.onerror = function () { if (cur === i) { fitRatio(lbPh, img); lbPh.classList.add('is-loaded'); } };
            if (it.srcset) { img.sizes = lbSizes(it.ratio); img.srcset = it.srcset; }
            img.src = it.full;
            lbPh.appendChild(img);
            renderLbTags(it.tags);
            updateLightboxNav();
            preload(i + 1);
            preload(i - 1);
            if (i >= images.length - 4) loadMore();
        }
        function step(d) {
            if (cur < 0) return;
            var n = cur + d;
            if (n < 0) return;
            if (n < images.length) { show(n); return; }
            loadMore().then(function () { if (!lb.hidden && n < images.length) show(n); });
        }
        function openLightbox(i) {
            lb.hidden = false;
            root.classList.add('lb-open');
            show(i);
            lbClose.focus();
        }
        function closeLightbox() {
            lb.hidden = true;
            root.classList.remove('lb-open');
            while (lbPh.firstChild) lbPh.removeChild(lbPh.firstChild);
            var tile = grid.querySelector('.tile[data-index="' + cur + '"]');
            if (tile) {
                var r = tile.getBoundingClientRect();
                if (r.bottom < 0 || r.top > window.innerHeight) tile.scrollIntoView({ block: 'center' });
                tile.focus({ preventScroll: true });
            }
            cur = -1;
        }

        lbPrev.addEventListener('click', function () { step(-1); });
        lbNext.addEventListener('click', function () { step(1); });
        lbClose.addEventListener('click', closeLightbox);
        lb.addEventListener('click', function (e) { if (e.target === lb || e.target.classList.contains('lb-stage') || e.target.classList.contains('lb-tags')) closeLightbox(); });

        // Phones/touch: tapping the photo goes to the next one (the arrow buttons are hidden there).
        var tapToAdvance = window.matchMedia('(max-width: 700px), (pointer: coarse)');
        lbPh.addEventListener('click', function () { if (tapToAdvance.matches) step(1); });

        document.addEventListener('keydown', function (e) {
            if (lb.hidden) return;
            if (e.key === 'ArrowLeft')       { e.preventDefault(); step(-1); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
            else if (e.key === 'Escape')     { e.preventDefault(); closeLightbox(); }
            else if (e.key === 'Tab') {
                // Keep focus inside the dialog.
                var f = Array.prototype.filter.call(lb.querySelectorAll('button'), function (b) { return !b.hidden; });
                var idx = f.indexOf(document.activeElement);
                e.preventDefault();
                f[(idx + (e.shiftKey ? f.length - 1 : 1)) % f.length].focus();
            }
        });

        lb.addEventListener('touchstart', function (e) {
            if (e.touches.length !== 1) return;
            touchX = e.touches[0].clientX;
            touchY = e.touches[0].clientY;
        }, { passive: true });
        lb.addEventListener('touchend', function (e) {
            if (touchX === null) return;
            var dx = e.changedTouches[0].clientX - touchX;
            var dy = e.changedTouches[0].clientY - touchY;
            touchX = touchY = null;
            if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
        }, { passive: true });

        /* ── Landing pages ────────────────────────────────── */
        function renderLanding(items) {
            items.forEach(function (item) {
                var a = el('a', 'place');
                a.href = tagUrl(item.tag);
                // 3:2 until the cover loads, then the photo's own shape.
                var ph = makePh(1.5, pastel(item.tag), item.cover, '', '', item.label);
                a.appendChild(ph);
                a.appendChild(el('span', 'place__label', item.label));
                landing.appendChild(a);
                if (item.cover) lazy(ph.firstChild);
            });
            landing.hidden = false;
        }

        /* ── Boot ─────────────────────────────────────────── */
        renderPageHead();

        if (isLanding) {
            body.classList.add('is-landing');
            landing.classList.add('landing--' + tag);
            renderLanding(CONFIG[tag]);
            return;
        }

        Array.prototype.slice.call(feed.querySelectorAll('.js-post')).forEach(function (a) {
            seen[a.id] = true;
            hydratePost(a);
        });

        if (isPermalink) {
            root.classList.remove('view-grid');
            root.classList.add('view-feed');
            loader.hidden = true;
            return;
        }

        toggle.hidden = false;
        syncToggle();
        if (section === 'people') renderPeoplePicker();

        if (shuffleMode) {
            loadAllThenShuffle();
            return;
        }

        if ('IntersectionObserver' in window) {
            new IntersectionObserver(function (entries) {
                if (entries[0].isIntersecting) maybeLoadMore();
            }, { rootMargin: '0px 0px 1500px 0px' }).observe(loader);
        } else {
            window.addEventListener('scroll', maybeLoadMore, { passive: true });
        }
        maybeLoadMore();
    })();
    </script>
</body>
</html>
